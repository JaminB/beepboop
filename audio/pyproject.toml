[project]
name = "beepboop-audio"
version = "0.0.0"
description = "beepboop audio service: wake word, VAD, speaker ID, STT, TTS behind the event socket"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
authors = [{ name = "beepboop contributors" }]
# sherpa-onnx and pymicro-wakeword are pinned exactly (CLAUDE.md hard rule 8,
# VOICE_PIPELINE §1, ADR 0009). Both publish cp312 wheels for win_amd64,
# manylinux x86_64 and manylinux aarch64, so no platform markers are needed.
dependencies = [
    "beepboop-protocol",  # event protocol + redacting log setup (ADR 0019)
    "pydantic>=2.11,<3",
    "structlog>=25.0",
    "numpy>=2.1",
    "sherpa-onnx==2.0.1",
    "pymicro-wakeword==2.5.0",
    "soundfile>=0.13",
    "piper-phonemize==1.5.9",
    "pyyaml>=6.0",       # /config/beepboop.yaml and models/manifest.yaml
    "argon2-cffi>=25.1", # spoken-PIN verification against core's argon2id hash (VOICE_PIPELINE §12)
    "soxr>=0.5",         # resampling to/from 16 kHz (VOICE_PIPELINE §2.3, §11.1)
]

[project.scripts]
beepboop-audio = "beepboop_audio.cli:main"

# Provider entry-point groups (VOICE_PIPELINE §17, CLAUDE.md §7.1). The ids are the
# hyphenated ones; `providers:` in /config/beepboop.yaml selects one per kind.
[project.entry-points."beepboop.wake_providers"]
microwakeword = "beepboop_audio.wake.microwakeword:MicroWakeWordProvider"

[project.entry-points."beepboop.speaker_providers"]
sherpa-campp = "beepboop_audio.speaker.sherpa_campp:CamppProvider"

[project.entry-points."beepboop.stt_providers"]
sherpa-zipformer = "beepboop_audio.stt.sherpa_zipformer:ZipformerProvider"

[project.entry-points."beepboop.tts_providers"]
sherpa-piper = "beepboop_audio.tts.sherpa_piper:PiperProvider"

[tool.uv.sources]
beepboop-protocol = { workspace = true }
piper-phonemize = { index = "k2-fsa-piper-phonemize" }

[[tool.uv.index]]
name = "k2-fsa-piper-phonemize"
url = "https://k2-fsa.github.io/icefall/piper_phonemize.html"
format = "flat"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beepboop_audio"]
