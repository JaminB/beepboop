# managed by beepboop -- do not hand-edit this block.
#
# Template for /srv/beepboop/ha/configuration.yaml (docs/HOME_ASSISTANT.md §2.1
# owns the content; OPERATIONS §7 the recorder budget). install.sh renders it,
# replacing https://beepboop.local with https://$BB_HOST from deploy/.env. This
# block is the ONLY place HA's internal_url/external_url are set (hard rule 10):
# onboarding does not call config/core/update.

default_config:

http:
  server_host: 127.0.0.1          # layer 1: bind to loopback only (M0 item V1 verifies this)
  use_x_forwarded_for: true
  trusted_proxies: [127.0.0.1]    # Caddy (OAuth callback, admin route) sits on loopback

homeassistant:
  internal_url: https://beepboop.local   # beepboop's canonical URL; see HOME_ASSISTANT §11
  external_url: https://beepboop.local

recorder:
  purge_keep_days: 3               # history lives in beepboop's activity timeline, not HA
  commit_interval: 30              # batch writes: SSD longevity and fewer fsyncs under load
  auto_purge: true
  exclude:
    domains: [update, sun, persistent_notification]
    entity_globs: ["sensor.*_rssi", "sensor.*_signal_strength", "sensor.*_uptime", "sensor.*_last_seen"]

logger:
  default: warning
