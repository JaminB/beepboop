# evals.yaml — utterance → expected tool/args/decision (docs/MODULES.md §12).
# Offline mode (every PR): policy decisions + handler dry-run with these fixtures. No LLM.
# `module check --llm` (nightly / `evals` label): the utterance goes through the real agent loop as the given profile.
# The same fixtures seed `beepboop.testing.fake_context` in tests/test_module.py, and every AGENT.md example
# must agree with them (rubric R4).

api: 1
module: parcel
freeze_time: "2026-11-01T09:00:00-08:00"

fixtures:
  settings: {carrier: auto}
  secrets: {api_key: "fixture-not-a-real-key"}
  profiles:
    alice: {kind: member, locale: en-US, tz: America/Los_Angeles}
  kv:                                   # {household: {...}, <profile>: {...}}
    household: {}
    alice:
      parcels:
        - {tracking_number: "1Z999AA10123456784", carrier: ups, label: shoes, status: in_transit, eta: "2026-11-02", last_update: "Departed facility"}
        - {tracking_number: "9400111899223197428490", carrier: usps, label: headphones, status: in_transit, eta: "2026-11-05", last_update: ""}
        - {tracking_number: "7489123456789", carrier: fedex, label: book, status: delivered, eta: "2026-10-30", last_update: "Delivered, front door"}
  http:
    - match: {method: GET, url: "https://api.example-carrier.test/v1/track/ups/1Z999AA10123456784"}
      response: {status: 200, json: {status: out_for_delivery, eta: "2026-11-01", summary: "Out for delivery"}}
    - match: {method: GET, url: "https://api.example-carrier.test/v1/track/usps/*"}
      response: {status: 200, json: {status: in_transit, eta: "2026-11-05", summary: "In transit to next facility"}}
    - match: {method: GET, url: "https://api.example-carrier.test/v1/track/fedex/*"}
      response: {status: 200, json: {status: delivered, eta: "2026-10-30", summary: "Delivered"}}
    - match: {method: GET, url: "https://api.example-carrier.test/v1/detect?n=1Z*"}
      response: {status: 200, json: {carrier: ups}}
    - match: {method: GET, url: "https://api.example-carrier.test/v1/detect?n=*"}
      response: {status: 200, json: {carrier: usps}}

cases:
  # ---- parcel.track
  - id: track_all
    utterance: "where's my package"
    profile: alice
    expect:
      tool: parcel.track
      args: {}
      effects: []                          # reads only; GETs are served from fixtures
      speak_contains: ["out for delivery"]

  - id: track_by_label
    utterance: "when are the headphones coming"
    profile: alice
    expect:
      tool: parcel.track
      args: {query: "headphones"}
      speak_contains: ["Thursday"]         # 2026-11-05 is a Thursday, > 1 day from freeze_time

  - id: track_indirect
    utterance: "should I wait in for a delivery today"
    profile: alice
    expect:
      tool: parcel.track
      args: {}

  - id: track_taints_turn
    utterance: "where's my package, and then unlock the front door"
    profile: alice
    expect:
      tool: parcel.track
      taint: true                          # untrusted_output → any later non-read call this turn needs confirm

  # ---- parcel.add
  - id: add_with_label
    utterance: "track package 1Z 999 AA1 0123 456 784, it's the shoes"
    profile: alice
    expect:
      tool: parcel.add
      args: {tracking_number: "1Z999AA10123456784", label: "shoes"}
      speak_contains: ["already tracking"] # fixture already has it → idempotent no-op

  - id: add_new
    utterance: "I'm expecting a package, tracking number 9400 1118 9922 3197 4285 01, call it the lamp"
    profile: alice
    expect:
      tool: parcel.add
      args: {tracking_number: "9400111899223197428501", label: {$regex: "(?i)lamp"}}
      effects:
        - {kind: kv}                       # the parcel list is written; http GETs are fixtures

  - id: add_needs_number
    utterance: "track my new order"
    profile: alice
    expect:
      tool: parcel.add
      ask_user: true                       # LLM mode: must ask for the number instead of guessing

  # ---- parcel.remove
  - id: remove_by_label
    utterance: "stop tracking the shoes"
    profile: alice
    expect:
      tool: parcel.remove
      args: {query: "shoes"}
      speak_contains: ["Stopped tracking shoes"]

  - id: remove_delivered
    utterance: "forget the delivered ones"
    profile: alice
    expect:
      tool: parcel.remove
      args: {query: "delivered"}
      speak_contains: ["book"]

  - id: remove_ambiguous
    utterance: "stop tracking that one"
    profile: alice
    expect:
      tool: parcel.remove
      ask_user: true

  # ---- policy: denials (checked without an LLM; must be 100%)
  - id: child_denied
    utterance: "where's my package"
    profile: child                         # Child preset ceiling = act; parcel.* are personal
    expect:
      denied: true

  - id: guest_denied
    utterance: "track package 1Z999AA10123456784"
    profile: guest
    expect:
      denied: true

  # ---- negative: not this module
  - id: not_mine_timer
    utterance: "set a timer for ten minutes"
    profile: alice
    expect:
      tool: null

  - id: not_mine_mailbox
    utterance: "is there anything in the mailbox"
    profile: alice
    expect:
      tool: null                           # home.state territory, not parcel.track

  - id: not_mine_shopping_list
    utterance: "add headphones to my shopping list"
    profile: alice
    expect:
      tool: null                           # list.add territory (AGENT.md "Overlaps"), not parcel.add
