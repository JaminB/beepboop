# `uv run pre-commit install` (CONTRIBUTING §2). Hooks run the workspace's own
# pinned tools through uv, so versions always match uv.lock and CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright (strict)
        entry: uv run --frozen pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: linkcheck
        name: markdown links
        entry: uv run --frozen python tools/ci/linkcheck.py
        language: system
        types: [markdown]
        pass_filenames: false
