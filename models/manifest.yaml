# beepboop model manifest (OPERATIONS §13): the single source of truth for every
# downloaded artifact. Weights are downloaded, never vendored; only this file and the
# generated LICENSES.md are tracked (see .gitignore).
#
#   python -m beepboop_bench.models fetch            download + sha256-verify + install
#   python -m beepboop_bench.models verify           re-hash the cache
#   python -m beepboop_bench.models licenses         regenerate LICENSES.md
#
# Schema: tools/bench/beepboop_bench/models.py (ModelEntry). `dest` is relative to this
# folder (mounted at /models in the containers). `files` names the files the code opens
# inside an extracted archive. sha256 values were recorded from the downloads on
# 2026-11-02 against the sherpa-onnx release assets.
schema_version: 1
models:
  - id: wespeaker-en-voxceleb-campp
    kind: speaker
    url: https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_CAM++.onnx
    sha256: c46fad10b5f81e1aa4a60c162714208577093655076c5450f8c469e522ec54ef
    size: 29292684
    dest: speaker/wespeaker_en_voxceleb_CAM++.onnx
    license: CC-BY-4.0
    attribution: "WeSpeaker (wenet-e2e) CAM++ trained on VoxCeleb; ONNX export published by the sherpa-onnx project (Apache-2.0 code)"
    source: https://github.com/wenet-e2e/wespeaker
    notes: "fp32, 16 kHz, the VOICE_PIPELINE §8.1 model. sherpa-onnx reports its embedding dim as 512 (measured 2026-11-02 on this file; the 3D-Speaker English CAM++ export is 512-d too), not the 192 the docs state: a spec issue for VOICE_PIPELINE §8.1 and the hello.speaker.dim contract. The int8 G1 fallback is not published by sherpa-onnx; add an entry if one is exported. (The release tag really is spelled 'recongition'.)"

