# evals.yaml — utterance → expected tool/args/decision (docs/MODULES.md §12).
# Offline: policy decision per case and the handler in dry-run against these fixtures.
# Every AGENT.md example agrees with these fixtures (rubric R4).

api: 1
module: timers
freeze_time: "2026-11-01T09:00:00-08:00"   # a Sunday, 17:00 UTC

fixtures:
  profiles:
    alice: {kind: member, locale: en-US, tz: America/Los_Angeles}
    # A child whose parents removed timers from her Access tab (IDENTITY_AND_TRUST §10).
    toddler:
      kind: child
      tz: America/Los_Angeles
      grants:
        - {resource: "tool_glob:home.*", max_risk: act}
        - {resource: "tool_glob:list.*", max_risk: act}
  kv:
    household: {}
    alice:
      timers:
        - {id: "a1b2c3d4", kind: timer, label: pasta, fires_at: "2026-11-01T17:04:00+00:00", anchor: duration, repeat: none, tz: America/Los_Angeles}
        - {id: "e5f6a7b8", kind: alarm, label: null, fires_at: "2026-11-02T14:30:00+00:00", anchor: clock, repeat: none, tz: America/Los_Angeles}
        - {id: "c9d0e1f2", kind: reminder, label: "call mom", fires_at: "2026-11-01T23:00:00+00:00", anchor: clock, repeat: none, tz: America/Los_Angeles}

cases:
  # ---- timer.set
  - id: set_timer_ten_minutes
    utterance: "set a timer for ten minutes"
    profile: alice
    expect:
      tool: timer.set
      args: {kind: timer, duration_s: 600}
      effects: [{kind: kv, key: timers}, {kind: kv, key: ring_index}]
      speak_contains: ["Timer set for 10 minutes"]
      path: fast

  - id: set_alarm_tomorrow
    utterance: "wake me at 6:30 tomorrow"
    profile: alice
    expect:
      tool: timer.set
      args: {kind: alarm, at: "2026-11-02T06:30:00-08:00"}
      speak_contains: ["6:30 AM tomorrow"]

  - id: set_reminder_in_an_hour
    utterance: "remind me in an hour to check the oven"
    profile: alice
    expect:
      tool: timer.set
      args: {kind: reminder, duration_s: 3600, label: "check the oven"}
      speak_contains: ["in 1 hour", "check the oven"]

  - id: set_weekday_alarm
    utterance: "wake me up at seven every weekday"
    profile: alice
    expect:
      tool: timer.set
      args: {kind: alarm, at: "2026-11-02T07:00:00-08:00", repeat: weekdays}
      speak_contains: ["every weekday"]

  - id: set_alarm_needs_time
    utterance: "set an alarm"
    profile: alice
    expect:
      tool: timer.set
      ask_user: true

  - id: guest_sets_timer
    utterance: "set a timer for five minutes"
    profile: guest                           # guest preset includes timer.* at act
    expect:
      tool: timer.set
      args: {kind: timer, duration_s: 300}
      speak_contains: ["5 minutes"]

  # ---- timer.list
  - id: list_how_long
    utterance: "how long is left"
    profile: alice
    expect:
      tool: timer.list
      args: {}
      effects: []
      speak_contains: ["pasta timer has 4 minutes left"]

  - id: list_alarms
    utterance: "what alarms do I have"
    profile: alice
    expect:
      tool: timer.list
      args: {kind: alarm}
      speak_contains: ["6:30 AM tomorrow"]

  - id: list_reminders
    utterance: "what reminders do I have"
    profile: alice
    expect:
      tool: timer.list
      args: {kind: reminder}
      speak_contains: ["call mom"]

  - id: list_empty_for_child
    utterance: "do I have a timer running"
    profile: child
    expect:
      tool: timer.list
      args: {kind: timer}
      speak_contains: ["don't have any timers"]

  # ---- timer.cancel
  - id: cancel_pasta
    utterance: "cancel the pasta timer"
    profile: alice
    expect:
      tool: timer.cancel
      args: {label: pasta}
      speak_contains: ["Cancelled your pasta timer"]

  - id: cancel_alarm
    utterance: "stop my alarm"
    profile: alice
    expect:
      tool: timer.cancel
      args: {kind: alarm}
      speak_contains: ["alarm for 6:30 AM tomorrow"]

  - id: cancel_everything
    utterance: "cancel all my timers"
    profile: alice
    expect:
      tool: timer.cancel
      args: {all: true}
      speak_contains: ["Cancelled 3"]

  - id: cancel_unknown_label
    utterance: "cancel the laundry timer"
    profile: alice
    expect:
      tool: timer.cancel
      args: {label: laundry}
      speak_contains: ["don't have a timer called laundry"]

  # ---- policy: denial
  - id: toddler_denied
    utterance: "set a timer for ten minutes"
    profile: toddler
    expect:
      tool: timer.set
      denied: true

  # ---- negative: not this module
  - id: not_mine_shopping
    utterance: "remind me to buy milk"
    profile: alice
    expect:
      tool: null                             # list.add territory (no time given)

  - id: not_mine_calendar
    utterance: "put dentist on my calendar Friday at 3"
    profile: alice
    expect:
      tool: null                             # caldav.create

  - id: not_mine_time
    utterance: "what time is it"
    profile: alice
    expect:
      tool: null
