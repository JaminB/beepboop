# lists: shared household lists and personal lists (docs/MODULES.md §16).
# Native, household-scoped; each list is one JSON value in ctx.kv: household scope for
# shared lists, profile scope for "my" lists. Works offline. list.add and list.read are
# always-loaded core tools (docs/MCP.md §4.9-§4.10); list.remove is deferred.

id: lists
api: 1
version: 0.1.0
summary: "Add to, read and remove items from shared household lists and each person's own lists."
scope: household
category: productivity
locales: [en]
license: GPL-3.0-or-later
keywords: [list, shopping, groceries, todo, to-do, add, buy, items, checklist]

# Native: v0.1 ruling (MODULES §17 #1). HA todo entities have no per-person owner.
requires:
  core: ">=0.1,<1"

settings:
  type: object
  properties: {}

tools:
  - name: list.add
    description: >-
      Add one or more items to a named list such as shopping, to-do or groceries. Use for "add
      milk to the shopping list", "put eggs and butter on the list", "remind me to buy…" when it
      is a purchase. Default list is shopping. "My" lists are personal; others are shared.
    risk: act
    untrusted_output: false
    deferred: false
    idempotent: true
    timeout_ms: 2000
    args:
      type: object
      properties:
        items:
          type: array
          items: {type: string, maxLength: 60}
          minItems: 1
          maxItems: 20
          description: "One entry per item, singular, lowercase: ['milk','eggs']."
        list:
          type: string
          default: shopping
          description: "List name as spoken: shopping, to-do, hardware store."
        personal:
          type: boolean
          default: false
          description: "True when the user said 'my list' / 'my to-do'."
      required: [items]
      additionalProperties: false
    output:
      type: object
      properties:
        speak: {type: string}
        list: {type: string}
        added: {type: array, items: {type: string}}
        already: {type: array, items: {type: string}}
        count: {type: integer}
      required: [speak, list, added]
    examples:
      - utterance: "add milk to the shopping list"
        args: {items: ["milk"]}
      - utterance: "put call the plumber on my to-do list"
        args: {items: ["call the plumber"], list: "to-do", personal: true}

  - name: list.read
    description: >-
      Read back a list. Use for "what's on the shopping list", "read my to-do list", "how many
      things on the list". Default list is shopping.
    risk: read
    untrusted_output: false
    deferred: false
    idempotent: true
    timeout_ms: 2000
    args:
      type: object
      properties:
        list:
          type: string
          default: shopping
          description: "List name as spoken; default shopping."
        personal:
          type: boolean
          default: false
          description: "True for the speaker's own list ('my to-do')."
      additionalProperties: false
    output:
      type: object
      properties:
        speak: {type: string}
        list: {type: string}
        items: {type: array, items: {type: string}}
      required: [speak, list, items]
    examples:
      - utterance: "what's on the shopping list"
        args: {}
      - utterance: "read my to-do list"
        args: {list: "to-do", personal: true}

  - name: list.remove
    description: >-
      Remove items from a list, or clear it. Use for "take milk off the shopping list", "I got
      the eggs", "cross off bread", "clear the shopping list". Same list naming as list.add.
    risk: act
    untrusted_output: false
    idempotent: true
    args:
      type: object
      properties:
        items:
          type: array
          items: {type: string, maxLength: 60}
          maxItems: 20
          description: "Items to remove, as the user said them. Omit with clear."
        list:
          type: string
          default: shopping
          description: "List name as spoken; default shopping."
        personal:
          type: boolean
          default: false
          description: "True for the speaker's own list."
        clear:
          type: boolean
          default: false
          description: "True to empty the whole list ('clear the list', 'start a new list')."
      additionalProperties: false
    output:
      type: object
      properties:
        speak: {type: string}
        list: {type: string}
        removed: {type: array, items: {type: string}}
        status: {type: string, enum: [ok, none_matched]}
      required: [speak, list, removed, status]
    examples:
      - utterance: "take milk off the shopping list"
        args: {items: ["milk"]}
      - utterance: "clear the shopping list"
        args: {clear: true}
